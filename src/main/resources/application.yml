spring:
  application:
    name: construction-calculator

  datasource:
    url: jdbc:postgresql://localhost:5432/construction_calculator
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG